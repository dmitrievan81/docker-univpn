# Variant A: headless UniVPN + SOCKS5 on localhost for host apps (xfreerdp3, curl, …)
services:
  univpn:
    image: jesusdf/huawei-vpn:latest
    container_name: univpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      # SOCKS5 only on loopback — host apps use 127.0.0.1:1080
      - "127.0.0.1:1080:1080"
    env_file:
      - .env
    environment:
      # UniVPNCS segfaults if USER is unset
      - USER=root
      - TZ=${TZ:-Europe/Moscow}
      - VPN_GATEWAY=${VPN_GATEWAY:?set VPN_GATEWAY in .env}
      - VPN_PORT=${VPN_PORT:-4443}
      - VPN_USERNAME=${VPN_USERNAME:?set VPN_USERNAME in .env}
      - VPN_PASSWORD=${VPN_PASSWORD:?set VPN_PASSWORD in .env}
      - TUN_DEVICE=${TUN_DEVICE:-cnem_vnic}
    volumes:
      # Passwords starting with "-" break upstream expect `send` without `--`
      - ./scripts/connect.exp:/opt/univpn/connect.exp:ro
    restart: unless-stopped

  # Shares univpn netns: SOCKS traffic follows VPN routes after tunnel is up
  socks:
    image: ginuerzh/gost:2.11.5
    container_name: univpn-socks
    network_mode: "service:univpn"
    depends_on:
      univpn:
        condition: service_started
    restart: always
    volumes:
      - ./scripts/socks-entrypoint.sh:/socks-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/socks-entrypoint.sh"]
    environment:
      - TUN_DEVICE=${TUN_DEVICE:-cnem_vnic}
      # Corporate DNS from UniVPN; avoids Amnezia fake-IP via Docker→host DNS
      - VPN_DNS=${VPN_DNS:-192.168.44.123 192.168.44.70}
      - VPN_DOMAIN=${VPN_DOMAIN:-corp.oooslk.ru}

  # HTTP CONNECT on loopback for JGit/EDT: they ignore socks5h and resolve
  # gitlab.oooslk.ru via host Amnezia fake-IP (198.18.x.x → HTTP 403).
  # CONNECT keeps the hostname; gost then dials SOCKS5 (remote DNS in VPN).
  http-proxy:
    image: ginuerzh/gost:2.11.5
    container_name: univpn-http-proxy
    network_mode: host
    depends_on:
      socks:
        condition: service_started
    restart: unless-stopped
    command: ["-L=http://127.0.0.1:8118", "-F=socks5://127.0.0.1:1080"]
